name: "B2R | Maintenance SEO et récupération"

# Un seul fichier à ajouter depuis GitHub Web dans .github/workflows.
# Installation initiale au push, puis reprise après chaque publication du CMS.
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/b2r-seo-recuperation.yml"
  workflow_run:
    workflows: ["Publier les Réflexions B2R"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: b2r-seo-maintenance-recovery
  cancel-in-progress: false

jobs:
  repair:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    steps:
      - name: Lire le dépôt source sans écraser les publications existantes
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Vérifier le domaine et le moteur actuel
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat CNAME)" = 'b2r-talents.fr'
          test -f scripts/generate_reflexions.py
          test -f .github/workflows/publish-reflexions.yml
      - name: Installer les composants seulement à la première exécution
        shell: bash
        run: |
          if test -f scripts/seo_maintenance.py; then
            echo "Moteur SEO déjà installé : aucun fichier remplacé."
            exit 0
          fi
          python - <<'PY'
          from pathlib import Path
          import base64,hashlib,io,zipfile
          repo=Path.cwd()
          allowed=['.htaccess', 'atelier-trajectoires-professionnelles/index.html', 'reflexions/publications/lessh1greaterneurodiversite-en-entreprise-avant-dinclure-encore-faut-il-comprendrelessh1greater/index.html', 'robots.txt', 'scripts/seo_maintenance.py', 'sitemap.xml', 'tests/test_seo_maintenance.py']
          expected={".htaccess": "b6a551f11b27b9d2eebad210e439e1f45b1746f9", "robots.txt": "45b3b12f15f6e573fe60085dade3653b48d1e1f2", "sitemap.xml": "4d7061175e466108ba7ce54531b770c809fbebb1", "reflexions/publications/lessh1greaterneurodiversite-en-entreprise-avant-dinclure-encore-faut-il-comprendrelessh1greater/index.html": "2991de038b1171523393e8c52af31f727b4ca66b"}
          # Prévenir un écrasement silencieux si le dépôt a changé depuis le diagnostic.
          for rel,sha_expected in expected.items():
              dest=repo/rel
              if not dest.is_file():
                  raise SystemExit(f"Arrêt de sécurité : fichier absent {rel}")
              blob=dest.read_bytes()
              sha=hashlib.sha1(b"blob "+str(len(blob)).encode()+b"\0"+blob).hexdigest()
              if sha!=sha_expected:
                  raise SystemExit(f"Arrêt de sécurité : fichier changé depuis vérification {rel}")
