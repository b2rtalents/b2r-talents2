      - name: Activer Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Installer les dépendances du CMS existant
        run: python -m pip install --disable-pip-version-check PyYAML Pillow
      - name: Exécuter les trois tests SEO de non-régression
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Régénérer les pages, migrer les anciennes URL et mettre à jour le sitemap
        run: python scripts/seo_maintenance.py --apply --regenerate
      - name: Vérifier toutes les URL, les liens et les canoniques
        run: python scripts/seo_maintenance.py --check
      - name: Vérifier le diff avant écriture
        run: git diff --check
      - name: Enregistrer les fichiers validés, sans changer les workflows GitHub
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'B2R TALENTS SEO'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'Aucune modification nécessaire'
            exit 0
          fi
          if git diff --cached --name-only | grep -q '^\.github/workflows/'; then
            echo 'SÉCURITÉ : le workflow ne doit pas modifier les fichiers GitHub Actions.' >&2
            exit 1
          fi
          git commit -m 'SEO : indexation, routes historiques et sitemap vérifiés'
          git push origin HEAD:main
      - name: Demander la publication GitHub Pages explicitement
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --method POST "repos/${{ github.repository }}/pages/builds" > /tmp/b2r-pages-build.json
          echo "Reconstruction GitHub Pages demandée. Réponse :"
          cat /tmp/b2r-pages-build.json
