name: Publier les Réflexions B2R

on:
  workflow_dispatch:
    inputs:
      payload:
        description: "Contexte Pages CMS"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: reflexions-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le site
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Préparer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: python -m pip install --disable-pip-version-check PyYAML Pillow

      - name: Identifier le contenu demandé
        id: entry
        env:
          PAYLOAD: ${{ inputs.payload }}
        shell: bash
        run: |
          ENTRY_PATH="$(printf '%s' "$PAYLOAD" | jq -r '.context.path // empty')"
          echo "path=$ENTRY_PATH" >> "$GITHUB_OUTPUT"
          echo "Contenu : $ENTRY_PATH"

      - name: Générer et contrôler les Réflexions
        run: python scripts/generate_reflexions.py --require-published "${{ steps.entry.outputs.path }}"

      - name: Contrôle Git
        run: git diff --check

      - name: Enregistrer la publication
        shell: bash
        run: |
          git config user.name "B2R TALENTS Publisher"
          git config user.email "actions@users.noreply.github.com"
          git add reflexions/contenus.json reflexions/publications
          if git diff --cached --quiet; then
            echo "Aucun changement à publier."
            exit 0
          fi
          git commit -m "Publication Réflexions B2R"
          git push origin HEAD:main
